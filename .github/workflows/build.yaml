name: Build Workflow

on:
  workflow_call:
    inputs:
      productName:
        required: false
        type: string
      deployVersion:
        required: false
        type: string
      deployConfiguration:
        required: false
        type: string
      deployTarget:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      productName: ${{ inputs.productName }}
      deployVersion: ${{ inputs.deployVersion }}
      deployConfiguration: ${{ inputs.deployConfiguration }}
      deployTarget: ${{ inputs.deployTarget }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Simulate Build
        run: |
          echo "Building product: ${{ inputs.productName }}"
          echo "Version: ${{ inputs.deployVersion }}"
          echo "Configuration: ${{ inputs.deployConfiguration }}"
          echo "Target: ${{ inputs.deployTarget }}"

  deploy:
    name: Deploy Workflow
    needs: build
    uses: ngarg1234/CICD/.github/workflows/deploy.yaml@main
    with:
      productName: ${{ inputs.productName }}
      deployVersion: ${{ inputs.deployVersion }}
      deployConfiguration: ${{ inputs.deployConfiguration }}
      buildType:
        type: string
        required: false
        default: full
      CONFIGURATION:
        type: string
        required: false
        default: release
      VALIDATE_ONLY:
        type: boolean
        required: false
        default: false
      deployVersion:
        type: string
        required: false
        default: latest
      deployTarget:
        type: string
        required: false
        default: DevTest

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Build
        run: |
          echo "Build type: ${{ inputs.buildType }}"
          echo "CONFIGURATION type: ${{ inputs.CONFIGURATION }}"

  deploy:
    needs: build
    name: Deploy App
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.VALIDATE_ONLY == false }}
    uses: ngarg1234/cs-prof-common-utilities/.github/workflows/deploy.yaml@master
    with:
      deployVersion: ${{ inputs.deployVersion }}
      deployTarget: ${{ inputs.deployTarget }}
